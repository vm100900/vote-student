<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Suggestions</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <span class="app-title">Class Suggestions</span>
    <button class="btn-primary" id="add-btn">+ New</button>
  </header>

  <div id="cookie-banner" class="cookie-banner" hidden>
    <span>This site uses a cookie so you can't vote twice. No personal data is collected.</span>
    <div class="cookie-actions">
      <button class="btn-primary btn-sm" id="cookie-accept">Accept</button>
      <button class="btn-ghost btn-sm" id="cookie-decline">Decline</button>
    </div>
  </div>

  <main>
    <section id="pinned-section" hidden>
      <p class="section-label">Pinned</p>
      <div id="pinned-list"></div>
    </section>
    <div id="suggestions-list"><p class="loading-msg">Loading…</p></div>
  </main>

  <dialog id="submit-dialog">
    <div class="dialog-header">New suggestion</div>
    <div class="dialog-body">
      <div class="field">
        <label for="title-field">Title</label>
        <input id="title-field" type="text" maxlength="120" placeholder="What's your idea?">
        <span class="char-count"><span id="title-count">0</span> / 120</span>
      </div>
      <div class="field">
        <label for="desc-field">Description <span class="optional">(optional)</span></label>
        <textarea id="desc-field" maxlength="500" placeholder="More details…" rows="3"></textarea>
        <span class="char-count"><span id="desc-count">0</span> / 500</span>
      </div>
    </div>
    <div class="dialog-footer">
      <button class="btn-ghost" id="cancel-btn">Cancel</button>
      <button class="btn-primary" id="submit-btn">Submit</button>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/github.js"></script>
  <script src="js/voter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
