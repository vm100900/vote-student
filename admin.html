<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Class Suggestions</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <span class="app-title">Admin</span>
    <label class="voting-toggle-wrap">
      <span class="toggle-label">Voting</span>
      <input type="checkbox" class="toggle-input" id="voting-toggle">
    </label>
  </header>

  <main>
    <section id="pinned-section" hidden>
      <p class="section-label">Pinned</p>
      <div id="pinned-list"></div>
    </section>
    <div id="suggestions-list"><p class="loading-msg">Log in to view suggestions.</p></div>
  </main>

  <dialog id="auth-dialog">
    <div class="dialog-header">Teacher login</div>
    <div class="dialog-body">
      <div class="field">
        <label for="password-field">Password</label>
        <input id="password-field" type="password" placeholder="Enter password">
      </div>
      <p id="auth-error" class="auth-error" hidden>Incorrect password.</p>
    </div>
    <div class="dialog-footer">
      <button class="btn-primary" id="login-btn">Log in</button>
    </div>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/github.js"></script>
  <script src="js/voter.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
